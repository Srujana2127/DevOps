groups:
  - name: quick-commerce-alerts
    rules:
      - alert: HighDeliveryDuration
        expr: histogram_quantile(0.95, sum(rate(quickcommerce_delivery_duration_seconds_bucket[2m])) by (le)) > 1800
        for: 30s
        labels:
          severity: warning
        annotations:
          summary: "High delivery time detected"
          description: "95th percentile delivery time is above 30 minutes."

      - alert: QuickCommerceAppDown
        expr: up{job="quick-commerce-app"} == 0
        for: 30s
        labels:
          severity: critical
        annotations:
          summary: "Quick-commerce app is down"
          description: "Prometheus cannot scrape the application."
