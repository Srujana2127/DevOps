
apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: flashsale-replicaset
spec:
  replicas: 3
  selector:
    matchLabels:
      app: flashsale
  template:
    metadata:
      labels:
        app: flashsale
    spec:
      containers:
        - name: flashsale
          image: flashsale:v1
          imagePullPolicy: Never
          ports:
            - containerPort: 5000
