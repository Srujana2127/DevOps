apiVersion: v1
kind: Pod
metadata:
  name: inventory-nginx
  namespace: inventory-exam
  labels:
    app: inventory-nginx
spec:
  containers:
    - name: nginx
      image: nginx:latest
      ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: nginx-nodeport
  namespace: inventory-exam
spec:
  type: NodePort
  selector:
    app: inventory-nginx
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30090
